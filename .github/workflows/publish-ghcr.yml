name: Publish Docker image to GHCR

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      micro:
        description: "Micro chain name to bake into the image (src/micros/micro_<micro>.h)"
        required: false
        default: "azcoin"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: azcoin-node
  MICRO_DEFAULT: azcoin

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # REQUIRED for multi-arch builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build tag list WITHOUT docker/metadata-action enable=... templates
      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}"

          REF_TYPE="${GITHUB_REF_TYPE}"
          REF_NAME="${GITHUB_REF_NAME}"
          SHA="${GITHUB_SHA}"

          # Always publish a sha tag (full 40-char sha)
          TAGS="${IMAGE}:sha-${SHA:0:7}"  # short SHA is common; use ${SHA} for full if preferred

          # If on default branch (main), add :latest
          if [[ "${REF_TYPE}" == "branch" ]] && [[ "${REF_NAME}" == "${{ github.event.repository.default_branch }}" ]]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi

          # If this is a git tag starting with 'v', also publish that tag (e.g. v1.2.3)
          if [[ "${REF_TYPE}" == "tag" ]] && [[ "${REF_NAME}" =~ ^v ]]; then
            TAGS="${TAGS},${IMAGE}:${REF_NAME}"
            TAGS="${TAGS},${IMAGE}:latest"  # optional: also update :latest on tagged releases
          fi

          # Output for next steps (e.g. docker/build-push-action)
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
